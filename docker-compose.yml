version: "3.8"
services:
  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - redis
    command: uvicorn server:app --host 0.0.0.0 --port 8000 --proxy-headers

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  mongodata:
